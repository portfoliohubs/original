name: Process Pending Doctor Images & Deploy

# Manual execution only — automated recurring schedules disabled per admin directive
on:
  workflow_dispatch:
    # Allows manual triggering exclusively from GitHub Actions UI or Admin Dashboard

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'image-processing-and-deploy'
  cancel-in-progress: false

jobs:
  process-images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Run Image Processing Script
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
        run: node scripts/process-pending-uploads.mjs

      - name: Check for New Static Images
        id: git-check
        run: |
          git status --porcelain
          if [ -n "$(git status --porcelain public/doctors/)" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and Push New Images to Repository
        if: steps.git-check.outputs.has_changes == 'true'
        run: |
          git config --global user.name 'portfoliohubs-bot[bot]'
          git config --global user.email 'portfoliohubs-bot@users.noreply.github.com'
          git add public/doctors/
          git commit -m "chore(images): manual-commit static doctor assets [skip ci]"
          git push origin HEAD

      - name: Build Static App & Portfolios
        run: npm run build

      - name: Setup GitHub Pages
        if: steps.git-check.outputs.has_changes == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/configure-pages@v4

      - name: Upload Pages Artifact
        if: steps.git-check.outputs.has_changes == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        if: steps.git-check.outputs.has_changes == 'true' || github.event_name == 'workflow_dispatch'
        id: deployment
        uses: actions/deploy-pages@v4
